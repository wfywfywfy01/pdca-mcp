name: PDCA MCP security CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies matching the production MCP SDK
        run: python -m pip install -r requirements.txt mcp==1.28.1
      - name: Reject embedded secrets without printing values
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urlsplit

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          failures = set()
          placeholders = {'password', 'your-password', 'your_password', 'change_me', 'changeme'}
          for name in filter(None, paths):
              path = Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8-sig', errors='replace')
              if path.name == '.env' or re.search(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', text):
                  failures.add(name)
              for match in re.finditer(r"postgres(?:ql)?://[^\s\"']+", text):
                  try:
                      uri = urlsplit(match.group())
                      if not uri.password or uri.hostname in {'localhost', '127.0.0.1', '::1'}:
                          continue
                      if path.name == '.env.example' and uri.password.lower() in placeholders:
                          continue
                  except ValueError:
                      pass
                  failures.add(name)
          if failures:
              print('Embedded-secret check failed; files only:')
              print('\n'.join(sorted(failures)))
              raise SystemExit(1)
          print('Embedded-secret check passed')
          PY
      - name: Run isolated unit and local MCP protocol tests (no database E2E)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile sources without running legacy E2E scripts
        run: python -m compileall -q src tests
